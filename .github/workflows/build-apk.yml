name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Scaffold
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          rm -rf android
          flutter create --project-name serenelle_direct --org com.serenelle --platforms android .
          cp pubspec.backup.yaml pubspec.yaml

      - name: Sync Android version from pubspec
        run: |
          VERSION_LINE=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_LINE%%+*}
          VERSION_CODE=${VERSION_LINE##*+}
          sed -i '/^flutter\.versionName=/d; /^flutter\.versionCode=/d' android/local.properties
          echo "flutter.versionName=$VERSION_NAME" >> android/local.properties
          echo "flutter.versionCode=$VERSION_CODE" >> android/local.properties

      - name: Inject In-App Auto-Updater Native Android Files
        run: node scripts/inject_android_updater.js

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serenelle-direct-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          name: "Serenelle Direct v1.0.10 — Automatic Updates"
          body: |
            ## Version 1.0.10

            - Ilova ochilganda yangi versiya avtomatik yuklanadi.
            - Yuklash tugagach Android o'rnatish oynasi avtomatik ochiladi.
            - Xatolik bo'lsa yangilash oynasidan qayta yuklash mumkin.

            ### 📥 O'rnatish:
            Quyidagi `app-release.apk` faylini yuklab oling va telefoningizga o'rnating. Kelgusi barcha yangilanishlar ilova ichidan avtomatik amalga oshadi!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
