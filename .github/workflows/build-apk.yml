name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Scaffold
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          rm -rf android
          flutter create --project-name serenelle_direct --org com.serenelle --platforms android .
          cp pubspec.backup.yaml pubspec.yaml

      - name: Inject In-App Auto-Updater Native Android Files
        run: node scripts/inject_android_updater.js

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serenelle-direct-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Serenelle Direct v1.0.3 (Magic Enchanted Orb, Direct Wrapped & Dynamic Scroll)"
          body: |
            ## 📱 Serenelle Direct v1.0.2 — O'zi Avtomatik Yangilanadigan Tizim

            - 🚀 **In-App Auto-Updater:** Endi har safar brauzerdan qayta yuklab o'rnatish shart emas. Ilova o'z ichida yangilanishlarni avtomatik aniqlaydi va bir bosishda yuklab o'rnatadi.
            - ⚡ **Tezkor 3ms Qidiruv:** Xotiradagi 14,170 ta xabardan bir zumda izlash.
            - 🔍 **Har qanday harf va belgi:** O'zbekcha `o'`, `g'`, kulgich va belgilar to'liq ishlaydi.
            - 💎 **120 FPS Native OLED Tajriba.**

            ### 📥 O'rnatish:
            Quyidagi `app-release.apk` faylini yuklab oling va telefoningizga o'rnating. Kelgusi barcha yangilanishlar ilova ichidan avtomatik amalga oshadi!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
